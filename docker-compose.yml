services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes_workspace
    ports:
      - "5433:5432"
    volumes:
      - notes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_workspace"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  notes_postgres_data:
